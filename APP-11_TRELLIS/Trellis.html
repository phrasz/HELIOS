    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  button.active { background: var(--accent); color: #06232b; border-color: var(--accent); font-weight: 600; }

  main { position: relative; flex: 1; overflow: hidden; }
  svg#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  svg#canvas:active { cursor: grabbing; }

  .link { fill: none; stroke: var(--link); stroke-width: 1.4px; }
  .node circle { stroke-width: 2px; cursor: pointer; }
  .node text {
    font-size: 11px;
    fill: var(--text);
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 3px;
    pointer-events: none;
  }
  .node.dimmed { opacity: 0.12; }
  .node.matched circle { stroke: var(--accent) !important; stroke-width: 3.5px; }
  .node.matched text { fill: var(--accent); font-weight: 700; }
  .link.dimmed { opacity: 0.06; }

  #legend {

    left: 20px; bottom: 18px;

    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--muted);
    backdrop-filter: blur(4px);

  #status {
    position: absolute;
    right: 20px; bottom: 18px;
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  #hint {
    position: absolute;
    left: 20px; top: 14px;
    font-size: 11px;
    color: var(--muted);
    max-width: 280px;
  }

me":"Rotor Head","size":0.5,"leaf":true},{"name":"Rotor Head","size":2.5,"leaf":true}]}]}]},{"name":"T-3 \u00b7 Assembler / Refinery","tier":"T-3","children":[{"name":"Assembler + Fabricator","children":[{"name":"Atmospheric Thruster","children":[{"name":"Atmospheric Thruster","size":10,"leaf":true}]},{"name":"Gravity Generator","children":[{"name":"Gravity Generator","size":5,"leaf":true}]}]},{"name":"Assembler + Refinery","children":[{"name":"Fabricator","children":[{"name":"Fabricator","size":10,"leaf":true}]},{"name":"Ion Thruster","children":[{"name":"Ion Thruster","size":5,"leaf":true}]}]},{"name":"Assembler + Refinery + Smelter","children":[{"name":"Hydrogen Thruster","children":[{"name":"Hydrogen Thruster","size":2.5,"leaf":true}]},{"name":"Piston","children":[{"name":"Piston","size":1.25,"leaf":true},{"name":"Piston","size":4.75,"leaf":true}]}]}]},{"name":"T-4 \u00b7 Fabricator / Refinery","tier":"T-4","children":[{"name":"Assembler + Fabricator + Refinery","children":[{"name":"Hydrogen Thruster","children":[{"name":"Hydrogen Thruster","size":7.5,"leaf":true}]},{"name":"Reactor","children":[{"name":"Reactor","size":7.5,"leaf":true}]}]},{"name":"Assembler + Fabricator + Smelter","children":[{"name":"Gyroscope","children":[{"name":"Gyroscope","size":7.5,"leaf":true}]}]},{"name":"Fabricator + Refinery","children":[{"name":"Ion Thruster","children":[{"name":"Ion Thruster","size":7.5,"leaf":true}]}]}]},{"name":"Unclassified","tier":"Unclassified","children":[{"name":"","children":[{"name":"Trade Terminal","children":[{"name":"Trade Terminal","size":2.5,"leaf":true}]},{"name":"Window Curved","children":[{"name":"Window Curved","size":2.5,"leaf":true}]},{"name":"Window Curved Inward Triangle","children":[{"name":"Window Curved Inward Triangle","size":2.75,"leaf":true}]},{"name":"Window Curved with Side Left","children":[{"name":"Window Curved with Side Left","size":2.5,"leaf":true}]},{"name":"Window Curved with Side Right","children":[{"name":"Window Curved with S /* ---------- build hierarchy ---------- */
let idCounter = 0;
const root = d3.hierarchy(DATA.tree);
root.descendants().forEach(d => { d.id = idCounter++; });

function countLeaves(d) {
  const kids = d.children || d._children;
  if (!kids || kids.length === 0) { d.leafCount = 1; return 1; }
  let sum = 0;
  kids.forEach(k => sum += countLeaves(k));
  d.leafCount = sum;
  return sum;
}
countLeaves(root);

function collapseRecursive(d) {
  if (d.children) {
    d._children = d.children;
    d.children = null;
    d._children.forEach(collapseRecursive);
  }
}
// initial state: only root + tier nodes visible
root.children.forEach(collapseRecursive);

/* ---------- color scale (ROYGBIV by size, log-mapped) ---------- */
const roygbiv = d3.scaleLinear()
  .domain([0, 1/6, 2/6, 3/6, 4/6, 5/6, 1])
  .range(['#e63946','#f3722c','#f9c74f','#52b788','#4361ee','#6a4c93','#b15eff'])
  .interpolate(d3.interpolateRgb);

const logMin = Math.log(DATA.minSize);
const logMax = Math.log(DATA.maxSize);
function sizeColor(size) {
  if (size == null) return '#33415c';
  const t = (Math.log(size) - logMin) / (logMax - logMin);
  return roygbiv(Math.max(0, Math.min(1, t)));
}

const STRUCTURAL_FILL = ['#0f1521', '#182238', '#22304c', '#2c3d60'];
function nodeColor(d) {
  if (d.data.leaf) return sizeColor(d.data.size);
  return STRUCTURAL_FILL[Math.min(d.depth, STRUCTURAL_FILL.length - 1)];
}
function nodeRadius(d) {
  if (d.data.leaf) {
    const s = d.data.size;
    return s ? Math.max(4, Math.min(11, 3 + Math.sqrt(s) * 2)) : 5;
  }
  return [13, 11, 9, 7][d.depth] ?? 6;
}
function labelFor(d) {
  if (d.data.leaf) return d.data.size != null ? `${d.data.size}m` : d.data.name;
  return `${d.data.name} (${d.leafCount})`;
}
function hasHiddenChildren(d) { return !!d._children; }

/* ---------- traversal helpers (see both visible & hidden branches) ---------- */
function eachAll(d, cb) {
  cb(d);
  const kids = d.children || d._children;
  if (kids) kids.forEach(k => eachAll(k, cb));
}
function expandAncestors(d) {
  let a = d.parent;
  while (a) {
    if (a._children) { a.children = a._children; a._children = null; }
    a = a.parent;
  }
}

/* ---------- layouts ---------- */
let layoutMode = 'tree';
const DX = 20, DY = 210;
const treeLayout = d3.tree().nodeSize([DX, DY]);

function maxVisibleDepth(r) {
  let m = 0;
  r.each(d => { if (d.depth > m) m = d.depth; });
  return m;
}

function computeLayout() {
  if (layoutMode === 'tree') {
    treeLayout(root);
    root.each(d => { d.px = d.y; d.py = d.x; });
  } else {
    const depth = Math.max(1, maxVisibleDepth(root));
    const radius = depth * 150 + 40;
    const radialLayout = d3.tree()
      .size([2 * Math.PI, radius])
      .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth);
    radialLayout(root);
    root.each(d => {
      const angle = d.x - Math.PI / 2;
      d.px = d.y * Math.cos(angle);
      d.py = d.y * Math.sin(angle);
    });
  }
}

function linkPath(d) {
  const s = d.source, t = d.target;
  if (layoutMode === 'tree') {
    const mx = (s.px + t.px) / 2;
    return `M${s.px},${s.py} C${mx},${s.py} ${mx},${t.py} ${t.px},${t.py}`;
  }
  return `M${s.px},${s.py} L${t.px},${t.py}`;
}

/* ---------- svg setup ---------- */
const svg = d3.select('#canvas');
const zoomLayer = svg.append('g').attr('class', 'zoom-layer');
const gLinks = zoomLayer.append('g').attr('class', 'links');
const gNodes = zoomLayer.append('g').attr('class', 'nodes');

const zoom = d3.zoom().scaleExtent([0.15, 3]).on('zoom', (event) => {
  zoomLayer.attr('transform', event.transform);
});
svg.call(zoom);

function centerView() {
  const bounds = svg.node().getBoundingClientRect();
  const initialScale = layoutMode === 'tree' ? 0.9 : 0.75;
  const tx = layoutMode === 'tree' ? 60 : bounds.width / 2;
  const ty = bounds.height / 2;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(initialScale));
}

let searchQuery = '';

function toggle(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else if (d._children) { d.children = d._children; d._children = null; }
  render();
}

function render() {
  computeLayout();
  const nodes = root.descendants();
  const links = root.links();

  gLinks.selectAll('path.link')
    .data(links, d => d.target.id)
    .join('path')
    .attr('class', d => 'link' + ((searchQuery && !(d.target.matched)) ? ' dimmed' : ''))
    .attr('d', linkPath);

  const nodeSel = gNodes.selectAll('g.node')
    .data(nodes, d => d.id)
    .join(enter => {
      const g = enter.append('g').attr('class', 'node');
      g.append('circle');
      g.append('text');
      g.on('click', (event, d) => toggle(d));
      return g;
    });

  nodeSel
    .attr('transform', d => `translate(${d.px},${d.py})`)
    .classed('matched', d => !!d.matched)
    .classed('dimmed', d => !!searchQuery && !d.matched);

  nodeSel.select('circle')
    .attr('r', nodeRadius)
    .attr('fill', nodeColor)
    .attr('stroke', d => hasHiddenChildren(d) ? '#0a0e16' : 'none')
    .attr('stroke-dasharray', d => hasHiddenChildren(d) ? '2,2' : null);

  nodeSel.select('text')
    .attr('x', d => nodeRadius(d) + 6)
    .attr('dy', '0.32em')
    .attr('text-anchor', 'start')
    .text(labelFor);

  document.getElementById('status').textContent =
    `${root.leafCount} blocks total · ${nodes.length} nodes visible`;
}

/* ---------- search ---------- */
function applySearch() {
  eachAll(root, d => { d.matched = false; });
  let matchCount = 0;
  if (searchQuery) {
    eachAll(root, d => {
      if (d.data.name.toLowerCase().includes(searchQuery)) {
        d.matched = true;
        matchCount++;
        expandAncestors(d);
        if (d._children) { d.children = d._children; d._children = null; }
      }
    });
  }
  document.getElementById('searchCount').textContent =
    searchQuery ? `${matchCount} match${matchCount === 1 ? '' : 'es'}` : '';
  render();
}

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  applySearch();
});

/* ---------- buttons ---------- */
document.getElementById('layoutTreeBtn').addEventListener('click', () => {
  layoutMode = 'tree';
  document.getElementById('layoutTreeBtn').classList.add('active');
  document.getElementById('layoutRadialBtn').classList.remove('active');
  render();
  centerView();
});
document.getElementById('layoutRadialBtn').addEventListener('click', () => {
  layoutMode = 'radial';
  document.getElementById('layoutRadialBtn').classList.add('active');
  document.getElementById('layoutTreeBtn').classList.remove('active');
  render();
  centerView();
});
document.getElementById('expandAllBtn').addEventListener('click', () => {
  eachAll(root, d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  render();
});
document.getElementById('collapseAllBtn').addEventListener('click', () => {
  function collapseDeep(d) {
    if (d.children) { d.children.forEach(collapseDeep); }
    if (d.children) { d._children = d.children; d.children = null; }
  }
  root.children && root.children.forEach(collapseDeep);
  document.getElementById('search').value = '';
  searchQuery = '';
  document.getElementById('searchCount').textContent = '';
  render();
});

/* ---------- init ---------- */
render();
centerView();
</script>
